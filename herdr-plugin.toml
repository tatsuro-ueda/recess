id = "recess"
name = "Recess"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "AI agent works, you watch. ON/OFF を herdr のアクションで切り替える（常駐は launchd）"
platforms = ["macos"]

[[actions]]
id = "on"
title = "Recess ON"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "on"]

[[actions]]
id = "off"
title = "Recess OFF"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "off"]

[[actions]]
id = "toggle"
title = "Recess ON/OFF toggle"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "toggle"]

[[actions]]
id = "status"
title = "Recess status"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "status"]
