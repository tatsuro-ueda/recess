id = "recess"
name = "Recess"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "A herdr plugin. AI works, you take recess: your video plays while the agents work, and pauses when herdr calls you back. ON/OFF are herdr actions (the resident part is launchd)."
platforms = ["macos"]

[[actions]]
id = "on"
title = "Recess ON"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "on"]

[[actions]]
id = "off"
title = "Recess OFF"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "off"]

[[actions]]
id = "toggle"
title = "Recess ON/OFF toggle"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "toggle"]

[[actions]]
id = "status"
title = "Recess status"
contexts = ["workspace"]
command = ["sh", "recess-mode.sh", "status"]
